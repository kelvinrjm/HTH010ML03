<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgFill" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradient for the central forecast upward trend -->
    <linearGradient id="trendGrad" x1="160" y1="360" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Gradient for Top Inventory Cube Cap (Sense/Optima) -->
    <linearGradient id="topCapGrad" x1="256" y1="110" x2="256" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Isometric Face Shading -->
    <linearGradient id="leftFace" x1="120" y1="210" x2="256" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="392" y1="210" x2="256" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <filter id="subtleGlow" x="180" y="80" width="220" height="220" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Enterprise Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgFill)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#1E293B" stroke-width="2.5" fill="none"/>

  <!-- Core Mark: An Isometric Inventory Cube fused with an ascending 'S' surge line and 3 allocation nodes -->
  <!-- Meaning:
       1. Isometric Cube = Stock / Inventory container & warehouse.
       2. Layered Segments = Stock levels & distribution tiers across stores.
       3. Ascending Dynamic S-curve Arrow = Predictive Demand Forecasting ('Sense').
       4. Balanced Triad Nodes = Multi-store allocation balance (HQ to store distribution).
  -->
  <g transform="translate(0, 8)">
    <!-- Base Foundation Tier: Lower Inventory Pallet / Safe Stock Layer -->
    <!-- Left lower wing -->
    <path d="M144 290L240 346V396L144 340V290Z" fill="#1E293B" fill-opacity="0.9"/>
    <!-- Right lower wing -->
    <path d="M272 346L368 290V340L272 396V346Z" fill="#334155" fill-opacity="0.9"/>

    <!-- Mid Inventory Level: Tiered Stock Division -->
    <path d="M144 224L240 280V326L144 270V224Z" fill="url(#leftFace)"/>
    <path d="M272 280L368 224V270L272 326V280Z" fill="url(#rightFace)"/>

    <!-- The 'S' Monogram & Predictive Forecast Vector -->
    <!-- Elegantly flows from bottom-left inventory bay, cuts through center allocation, and projects upward to top-right peak demand -->
    <path d="M168 312C140 280 148 228 196 200L256 166C296 142 344 156 348 200C350 236 318 262 276 286L236 308C204 326 198 358 220 376C242 394 276 392 312 372" 
          stroke="url(#trendGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Precision Diamond / Optimum Balance Core (Cube Top) -->
    <path d="M256 128L340 176L256 224L172 176L256 128Z" fill="url(#topCapGrad)" fill-opacity="0.95"/>

    <!-- Top Forecast Target / StockSense Intelligence Beacon -->
    <g filter="url(#subtleGlow)">
      <circle cx="348" cy="192" r="16" fill="#38BDF8"/>
      <circle cx="348" cy="192" r="7" fill="#FFFFFF"/>
    </g>

    <!-- 3 Multi-Store Balanced Allocation Dots (Coimbatore, Chennai, Madurai distribution) -->
    <circle cx="172" cy="176" r="6.5" fill="#60A5FA"/>
    <circle cx="256" cy="128" r="6.5" fill="#93C5FD"/>
    <circle cx="256" cy="224" r="6.5" fill="#38BDF8"/>
  </g>
</svg>
