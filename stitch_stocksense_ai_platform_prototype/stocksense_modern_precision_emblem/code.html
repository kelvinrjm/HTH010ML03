<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Core Blue Gradients -->
    <linearGradient id="primaryFlow" x1="120" y1="360" x2="390" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="topFacet" x1="180" y1="120" x2="380" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="280" y1="160" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="130" y1="200" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="90" y="80" width="332" height="342" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="118" stroke="#1E293B" stroke-width="3" fill="none"/>

  <!-- Geometric Inventory Cube Meets Predictive Trajectory Symbol -->
  <!-- Center coordinates approx (256, 256) -->
  <g filter="url(#glow)">
    
    <!-- Lower Left Isometric Block (Inventory Foundation) -->
    <path d="M140 264L236 318V382L140 328V264Z" fill="url(#leftFacet)"/>
    
    <!-- Lower Right Isometric Block (Balanced Allocation) -->
    <path d="M276 318L372 264V328L276 382V318Z" fill="url(#rightFacet)"/>

    <!-- Middle Floating Intelligence Diamond / Core Node -->
    <path d="M256 228L324 190L256 152L188 190L256 228Z" fill="#F8FAFC" fill-opacity="0.95"/>
    <path d="M256 228L324 190V216L256 254V228Z" fill="#94A3B8"/>
    <path d="M256 228L188 190V216L256 254V228Z" fill="#CBD5E1"/>

    <!-- Dynamic Ascending Ribbon Forming 'S' Flow & Demand Uptrend -->
    <!-- Continuous, precision bevel ribbon looping up into the future -->
    <path d="M164 300C132 260 144 200 196 172L316 112C348 96 384 120 384 156C384 178 370 198 350 208L240 262C216 274 208 302 222 324C234 342 258 350 278 340L336 312" 
          stroke="url(#primaryFlow)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Predictive Target Beacon / Precision Pulse Point -->
    <circle cx="384" cy="156" r="14" fill="#FFFFFF"/>
    <circle cx="384" cy="156" r="24" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.6"/>
  </g>
</svg>
